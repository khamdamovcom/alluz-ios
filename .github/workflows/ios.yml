# AllUz iOS: Mac'da yig'ish (GitHub bulutli macOS). Har push (istalgan branch) — simulyator uchun yig'ish (kompilyatsiya tekshiruvi);
# qo'lda: shots — skrinshotlar (sinov va App Store), release — App Store Connect'ga yuklash (TestFlight). Batafsil: README.md
# pull_request trigger ataylab yo'q: begona fork'lar maxfiy kalitlarga ham, runner'ga ham yetib kelmaydi.
name: iOS

on:
  push:
    paths: ['AllUz/**', 'project.yml', '.github/workflows/ios.yml', 'scripts/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'build | shots | release'
        type: choice
        options: [build, shots, release]
        default: build
      runner:
        description: 'macOS runner (macos-26 band bo‘lsa — macos-15 / macos-15-intel, Xcode 26 tanlanadi)'
        type: choice
        options: [macos-26, macos-15, macos-15-intel]
        default: macos-26
      list:
        description: 'Skrinshotlar: spec=nom bo‘sh joy bilan (bo‘sh — App Store to‘plami), masalan: tab:home=home item:place:registon=registon-dark'
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.mode || 'build' }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    # Imzolash kalitlari faqat «release» muhitida (faqat main branch'dan) — boshqa branch/rejim ularni ko'rmaydi
    environment: ${{ (inputs.mode == 'release' && github.ref == 'refs/heads/main') && 'release' || '' }}
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'build' }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Xcode va vositalar
        run: |
          # macos-15 da standart Xcode eskiroq — iOS 26 SDK (Liquid Glass) uchun eng yangi Xcode 26 tanlanadi
          if ! xcodebuild -version | grep -q '^Xcode 26'; then
            X="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
            [ -n "$X" ] || { echo "Xcode 26 topilmadi"; ls -d /Applications/Xcode*.app; exit 1; }
            sudo xcode-select -s "$X"
          fi
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcodegen generate
      - name: Yig'ish (simulyator)
        if: env.MODE == 'build'
        run: |
          set -o pipefail
          xcodebuild -project AllUz.xcodeproj -scheme AllUz -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | xcbeautify --renderer github-actions
      - name: Skrinshotlar
        if: env.MODE == 'shots'
        env:
          SHOT_LIST: ${{ inputs.list }}
          WAIT: ${{ inputs.runner == 'macos-15-intel' && '18' || '8' }}
          WARMUP: ${{ inputs.runner == 'macos-15-intel' && '90' || '60' }}
        run: bash scripts/shots.sh
      - name: App Store Connect'ga yuklash
        if: env.MODE == 'release'
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASS: ${{ secrets.DIST_P12_PASS }}
          PROFILE_B64: ${{ secrets.PROFILE_B64 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/release.sh
      - uses: actions/upload-artifact@v7
        if: env.MODE == 'shots'
        with:
          name: shots
          path: shots/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure() && env.MODE != 'release'   # release logida kalit identifikatorlari bo'lishi mumkin — ochiq repoda yuklanmaydi
        with:
          name: build-log
          path: build.log
          retention-days: 3
          if-no-files-found: ignore
