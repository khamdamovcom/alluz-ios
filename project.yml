# All Uzbekistan iOS ilovasi — XcodeGen loyihasi (Mac'da: brew install xcodegen && xcodegen generate). CI: .github/workflows/ios.yml
# Ma'lumot https://alluzbekistan.com/api/app/v1 dan (sayt bilan bir xil kontent). Batafsil: README.md, docs/API.md
name: AllUz
options:
  bundleIdPrefix: com.alluzbekistan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  AllUz:
    type: application
    platform: iOS
    sources:
      - path: AllUz
    info:
      path: AllUz/Info.plist
      properties:
        CFBundleDisplayName: All Uzbekistan
        CFBundleName: AllUz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, uz]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: Your location is used only on this device to show nearby places on the map. It is never sent to our server.
        LSApplicationQueriesSchemes: [tg, comgooglemaps, yandexmaps]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          # Ikkinchi himoya qatlami (Pinning.swift bilan bir xil ildizlar): ATS o'zi ham tekshiradi — har qanday URLSession uchun
          NSPinnedDomains:
            alluzbekistan.com:
              NSIncludesSubdomains: false
              NSPinnedCAIdentities:
                - SPKI-SHA256-BASE64: C5+lpZ7tcVwmwQIMcRtPbsQtWLABXhQzejna0wHFr8M=
                - SPKI-SHA256-BASE64: diGVwiVYbubAI3RW4hB9xU8e/CH2GnkuvVFZE8zmgzI=
                - SPKI-SHA256-BASE64: fk6IOKit1ild5647BH06ujSIq5XbCgqlbYl6ANhhi88=
                - SPKI-SHA256-BASE64: sCkq5UWXjg+7mKu9lMhhYF5bGLsy7VI/UNW3tccdR7w=
                - SPKI-SHA256-BASE64: hxqRlPTu1bMS/0DITB1SSu0vd4u/8l8TjPgfaAp63Gc=
                - SPKI-SHA256-BASE64: mEflZT5enoR1FuXLgYYGqnVEoZvmf9c2bVBpiOjYQ0c=
                - SPKI-SHA256-BASE64: x4QzPSC810K5/cMjb05Qm4k3Bw5zBn4lTdO/nEW/Td4=
                - SPKI-SHA256-BASE64: ICGRfpgmOUXIWcQ/HXPLQTkFPEFPoDyjvH7ohhQpjzs=
        CFBundleURLTypes:
          - CFBundleURLName: com.alluzbekistan.app
            CFBundleURLSchemes: [alluz]
    entitlements:
      path: AllUz/AllUz.entitlements
      properties:
        com.apple.developer.associated-domains: ["applinks:alluzbekistan.com"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alluzbekistan.app
        PRODUCT_NAME: AllUz
        TARGETED_DEVICE_FAMILY: "1"   # faqat iPhone (XcodeGen target darajasida "1,2" qo'yadi — loyiha darajasidagisi yetmaydi)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  AllUz:
    build:
      targets:
        AllUz: all
    run:
      config: Debug
    archive:
      config: Release
